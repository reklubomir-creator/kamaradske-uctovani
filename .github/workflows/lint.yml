name: Validate app source

on:
  push:
    branches: [test-cesky-hosting, vedos-backend-prototype]
  pull_request:
    branches: [test-cesky-hosting, vedos-backend-prototype]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          tools: none

      - name: Check PHP syntax
        run: php -l api/index.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.IGNORECASE)
          if not scripts:
              raise SystemExit("No inline script found in index.html")
          Path("/tmp/kamaradske-uctovani-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/kamaradske-uctovani-inline.js

  api-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: ku_test
          MARIADB_USER: ku_test_user
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          tools: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create disposable test schema
        env:
          MYSQL_PWD: ci-test-password
        run: mysql --protocol=TCP -h 127.0.0.1 -u ku_test_user ku_test < api/schema.sql

      - name: Create temporary API config
        run: |
          cat > api/config.php <<'PHP'
          <?php
          return [
              'db_host' => '127.0.0.1',
              'db_name' => 'ku_test',
              'db_user' => 'ku_test_user',
              'db_password' => 'ci-test-password',
              'allowed_origins' => [
                  'https://vyuctovani.lubarek.cz',
              ],
          ];
          PHP

      - name: Start local PHP server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/ku-api-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:8080/api/index.php?action=read&token=not-a-real-token" || true)
            if [ "$code" = "404" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code:-}" != "404" ]; then
            cat /tmp/ku-api-server.log
            exit 1
          fi

      - name: Exercise API lifecycle and security checks
        run: python3 api/tests/integration.py
