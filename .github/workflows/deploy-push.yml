name: Deploy Web Push
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: finance-push-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy notification worker
        run: npx --yes wrangler@4.45.0 deploy --config push/wrangler.toml
      - name: Verify deployed notification service
        run: |
          base=https://kamaradske-uctovani-push.rek-lubomir.workers.dev
          curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 "$base/health"             | jq -e '.ok == true'
          curl --fail --silent --show-error --max-time 15 -H 'Origin: https://finance.lubarek.cz' "$base/config"             | jq -e '.publicKey | length == 87'
